<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Wealth Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .register-logo {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 20px;
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
        }
        .btn-register {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .password-requirements {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center">
            <div class="register-logo">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h3 class="mb-4">Create Account</h3>
        </div>

        <!-- Error Messages -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${usernameError}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${usernameError}"></span>
        </div>
        <div th:if="${emailError}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${emailError}"></span>
        </div>
        <div th:if="${passwordError}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${passwordError}"></span>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" th:field="*{username}" class="form-control" 
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" 
                               placeholder="Choose username" required>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" th:field="*{fullName}" class="form-control" 
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                               placeholder="Your full name" required>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" th:field="*{email}" class="form-control" 
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="your@email.com" required>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{password}" class="form-control" 
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               placeholder="Create password" required>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirmPassword" class="form-control" 
                               placeholder="Confirm password" required>
                    </div>
                </div>
            </div>
            
            <div class="password-requirements mb-3">
                <i class="bi bi-info-circle"></i> Password should be at least 6 characters
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label" for="terms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-register w-100">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <hr>

        <div class="text-center">
            <p class="mb-0">Already have an account? <a href="/login" class="text-decoration-none">Login here</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
