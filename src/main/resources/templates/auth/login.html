<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wealth Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-logo {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 20px;
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
        }
        .btn-login {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span {
            padding: 0 15px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div class="login-logo">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h3 class="mb-4">Welcome Back!</h3>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
        </div>
        
        <!-- Success Message from Registration -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="text-center">
            <p class="mb-0">Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></p>
        </div>
        
        <hr>
        
        <!-- Demo Credentials -->
        <div class="small text-muted text-center">
            <p class="mb-1"><strong>Demo Credentials:</strong></p>
            <p class="mb-0">Admin: admin / admin123</p>
            <p class="mb-0">User: advisor / advisor123</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
