<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Client' : 'Add New Client'">Client Form - Wealth Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, var(--primary-color) 0%, #1a252f 100%); padding-top: 20px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; margin: 2px 10px; border-radius: 8px; }
        .sidebar .nav-link:hover { color: white; background-color: rgba(255,255,255,0.1); }
        .sidebar .nav-link.active { color: white; background-color: var(--secondary-color); }
        .sidebar .nav-link i { margin-right: 10px; }
        .brand-logo { color: white; font-size: 1.5rem; font-weight: bold; padding: 0 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .brand-logo i { color: var(--secondary-color); }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); }
        .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 0.2rem rgba(52,152,219,0.25); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="brand-logo"><i class="bi bi-graph-up-arrow"></i> WMS</div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/clients"><i class="bi bi-people"></i> Clients</a></li>
                    <li class="nav-item"><a class="nav-link" href="/plans"><i class="bi bi-clipboard-data"></i> Investment Plans</a></li>
                    <li class="nav-item"><a class="nav-link" href="/portfolios"><i class="bi bi-briefcase"></i> Portfolios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-file-earmark-text"></i> Reports</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COMPLIANCE_OFFICER')">
                        <a class="nav-link" href="/compliance"><i class="bi bi-shield-check"></i> Compliance</a>
                    </li>
                    <hr class="text-white-50 mx-3">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="nav-link btn btn-link text-start w-100"><i class="bi bi-box-arrow-right"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/clients">Clients</a></li>
                        <li class="breadcrumb-item active" th:text="${isEdit} ? 'Edit Client' : 'Add New Client'">Form</li>
                    </ol>
                </nav>

                <!-- Page Header -->
                <div class="mb-4">
                    <h2>
                        <i class="bi" th:classappend="${isEdit} ? 'bi-pencil-square' : 'bi-person-plus'"></i>
                        <span th:text="${isEdit} ? 'Edit Client' : 'Add New Client'">Client Form</span>
                    </h2>
                    <p class="text-muted" th:text="${isEdit} ? 'Update client information' : 'Enter details for a new client'">Form description</p>
                </div>

                <!-- Form Card -->
                <div class="card">
                    <div class="card-body p-4">
                        <form th:action="${isEdit} ? @{/clients/{id}(id=${client.clientId})} : @{/clients}" 
                              th:object="${client}" method="post">
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                                           placeholder="Enter full name" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                        Name error
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" 
                                           placeholder="Enter email address" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                        Email error
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}" 
                                           placeholder="Enter phone number" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                                        Phone error
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="dateOfBirth" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}">
                                        Date of birth error
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" th:field="*{address}" rows="3" 
                                          placeholder="Enter full address"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                                    Address error
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between">
                                <a href="/clients" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi" th:classappend="${isEdit} ? 'bi-check-lg' : 'bi-plus-lg'"></i>
                                    <span th:text="${isEdit} ? 'Update Client' : 'Add Client'">Submit</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
