# ========================================
# WEALTH MANAGEMENT SYSTEM - APPLICATION PROPERTIES
# ========================================
# This file contains all configuration settings for our application.
# Think of it as the "settings" or "preferences" file.

# ========================================
# APPLICATION NAME
# ========================================
spring.application.name=WealthManagementSystem

# ========================================
# SERVER CONFIGURATION
# ========================================
# The port on which our application will run
# Access the app at: http://localhost:8080
server.port=9090

# ========================================
# DATABASE CONFIGURATION
# ========================================
# These settings tell Spring Boot how to connect to MySQL

# Database URL format: jdbc:mysql://hostname:port/database_name
# - jdbc:mysql = Protocol for MySQL connection
# - localhost = Database is on the same machine
# - 3306 = Default MySQL port
# - wealth_management_db = Name of our database
spring.datasource.url=jdbc:mysql://localhost:3306/wealth_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database credentials
spring.datasource.username=root
spring.datasource.password=31072003

# MySQL Driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
# Hibernate is the ORM (Object-Relational Mapping) tool
# It converts Java objects to database tables automatically

# DDL-Auto options:
# - create = Drop and recreate tables on every startup (DANGEROUS in production!)
# - update = Update schema without losing data (Good for development)
# - validate = Only validate schema, no changes
# - none = Do nothing
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL specific dialect - tells Hibernate how to generate MySQL-compatible SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# THYMELEAF CONFIGURATION
# ========================================
# Thymeleaf is our template engine for creating HTML pages

# Where to find templates
spring.thymeleaf.prefix=classpath:/templates/

# File extension for templates
spring.thymeleaf.suffix=.html

# Disable caching during development (see changes immediately)
spring.thymeleaf.cache=false

# ========================================
# LOGGING CONFIGURATION
# ========================================
# Controls what information is printed in the console

# Set logging levels (DEBUG, INFO, WARN, ERROR)
logging.level.org.springframework.security=INFO
logging.level.com.wms=DEBUG

# ========================================
# SPRING SECURITY
# ========================================
# Session management
server.servlet.session.timeout=30m

# ========================================
# ERROR HANDLING
# ========================================
# Include error messages in responses
server.error.include-message=always
server.error.include-binding-errors=always
